<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>미니 칼바람</title>
<style>
  :root { --bg:#0b1a24; --panel:#142a36; --ink:#e8f1f5; --gold:#f2c14e; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink);
    font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif; overflow:hidden; touch-action:none; }
  canvas { display:block; width:100vw; height:100vh; }
  #join { position:fixed; inset:0; display:grid; place-items:center; background:var(--bg); }
  #join form { width:min(380px,90vw); display:grid; gap:12px; }
  h1 { margin:0 0 4px; font-size:34px; letter-spacing:-1px; }
  p.sub { margin:0 0 8px; color:#8fb0c0; line-height:1.5; }
  input, select, button { font:inherit; padding:12px 14px; border-radius:8px; border:2px solid #2a4756; background:var(--panel); color:var(--ink); }
  input:focus-visible, select:focus-visible, button:focus-visible { outline:3px solid var(--gold); outline-offset:2px; }
  button.go { background:var(--gold); color:#1a1405; border-color:var(--gold); font-weight:700; cursor:pointer; }
  #skills { position:fixed; right:12px; bottom:calc(12px + env(safe-area-inset-bottom,0px)); display:flex; gap:8px; }
  #skills button { width:64px; height:64px; font-weight:700; font-size:18px; position:relative; overflow:hidden; }
  #skills i { position:absolute; left:0; bottom:0; width:100%; height:0; background:#000a; }
  #msg { position:fixed; top:14%; left:0; right:0; text-align:center; font-size:40px; font-weight:800; pointer-events:none; text-shadow:0 2px 12px #000; }
  #hint { position:fixed; left:12px; top:12px; font-size:13px; color:#8fb0c0; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="msg"></div>
<div id="hint">우클릭/탭: 이동 · Q / W: 스킬 · 미니맵 클릭: 이동 · 근처 적은 자동 공격</div>
<div id="skills" hidden>
  <button id="bq">Q<i></i></button><button id="bw">W<i></i></button>
</div>
<div id="join">
  <form id="f">
    <h1>미니 칼바람</h1>
    <p class="sub">외길 다리 위에서 타워를 순서대로 부수고 넥서스를 먼저 파괴하세요. 같은 방 코드를 쓰면 같은 판에서 만나요.</p>
    <input id="nick" placeholder="닉네임" maxlength="10" required autocomplete="off">
    <select id="ch" aria-label="챔피언">
      <option value="random">무작위 (칼바람 스타일)</option>
      <option value="xerath">제라스 – 장거리 관통 Q, 범위 폭발 W</option>
      <option value="sett">세트 – 주변 강타 Q, 보호막 W</option>
      <option value="yasuo">야스오 – 관통 Q, 바람 장막 W</option>
      <option value="teemo">티모 – 암살 다트 Q, 이속 증가 W</option>
      <option value="seungwoo">승우이 – 3갈래 Q, 회복 W</option>
    </select>
    <input id="room" placeholder="방 코드 (예: 3반)" maxlength="20" value="main" required autocomplete="off">
    <button class="go">입장</button>
  </form>
</div>
<script>
// ★ 워커 배포 후 본인 주소로 바꾸세요 (wss:// 로 시작, 끝에 /ws)
const WS_URL = "wss://lol.ypec.site/ws";

const W = 2000, H = 500;
const NAMES = { xerath:"제라스", sett:"세트", yasuo:"야스오", teemo:"티모", seungwoo:"승우이" };
const COL = { b:"#4aa3ff", r:"#ff5a6a" };
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
let ws, me = {}, snap = null, disp = new Map(), fxs = [];
let dpr = 1, scale = 1, VW = 1000, cam = { x: 0, y: 0 }, mouse = { x: W/2, y: H/2 }, mini = { x:0, y:0, w:0, h:0 };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

function resize() {
  dpr = devicePixelRatio || 1;
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
  VW = innerWidth < innerHeight ? 600 : 1000;
  scale = cv.width / VW;
  mini.w = Math.min(300 * dpr, cv.width * 0.45); mini.h = mini.w * H / W;
  mini.x = 12 * dpr; mini.y = cv.height - mini.h - 12 * dpr;
}
addEventListener("resize", resize); resize();

const toWorld = (e) => ({ x: e.clientX * dpr / scale + cam.x, y: e.clientY * dpr / scale + cam.y });
function send(o) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); }

cv.addEventListener("contextmenu", (e) => e.preventDefault());
cv.addEventListener("pointerdown", (e) => {
  const sx = e.clientX * dpr, sy = e.clientY * dpr;
  if (sx > mini.x && sx < mini.x + mini.w && sy > mini.y && sy < mini.y + mini.h) {
    send({ t: "mv", x: (sx - mini.x) / mini.w * W, y: (sy - mini.y) / mini.h * H }); return;
  }
  const p = toWorld(e); mouse = p;
  if (e.button === 2 || e.pointerType === "touch") send({ t: "mv", x: p.x, y: p.y });
});
cv.addEventListener("pointermove", (e) => { mouse = toWorld(e); });
addEventListener("keydown", (e) => {
  const k = e.key.toLowerCase();
  if (k === "q" || k === "w") send({ t: k, x: mouse.x, y: mouse.y });
});
bq.onclick = () => send({ t: "q", x: mouse.x, y: mouse.y });
bw.onclick = () => send({ t: "w", x: mouse.x, y: mouse.y });

f.onsubmit = (e) => {
  e.preventDefault();
  ws = new WebSocket(WS_URL + "?room=" + encodeURIComponent(room.value.trim()));
  ws.onopen = () => {
    send({ t: "name", n: nick.value.trim(), ch: ch.value });
    join.hidden = true; skills.hidden = false;
  };
  ws.onmessage = (ev) => {
    const m = JSON.parse(ev.data);
    if (m.t === "hi") { me = m; bq.firstChild.textContent = "Q"; }
    if (m.t === "s") {
      snap = m;
      const now = performance.now();
      for (const x of m.fx) fxs.push({ x: x[0], y: x[1], r: x[2], team: x[3], t: now });
    }
  };
  ws.onclose = () => { snap = null; join.hidden = false; skills.hidden = true; msg.textContent = ""; };
  ws.onerror = () => alert("서버에 연결할 수 없습니다. WS_URL 주소와 학교 네트워크를 확인하세요.");
};

function circle(x, y, r, fill, stroke, lw = 3) {
  ctx.beginPath(); ctx.arc(x, y, r, 0, 7);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
}
function bar(x, y, w, v, max, color) {
  ctx.fillStyle = "#000a"; ctx.fillRect(x - w/2, y, w, 6);
  ctx.fillStyle = color; ctx.fillRect(x - w/2, y, w * Math.max(0, v / max), 6);
}

function draw() {
  requestAnimationFrame(draw);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = "#07111a"; ctx.fillRect(0, 0, cv.width, cv.height);
  if (!snap) return;

  for (const p of snap.p) {
    let d = disp.get(p[0]);
    if (!d) { d = { x: p[3], y: p[4] }; disp.set(p[0], d); }
    d.x += (p[3] - d.x) * 0.35; d.y += (p[4] - d.y) * 0.35;
  }
  const my = disp.get(me.id) || { x: W/2, y: H/2 };
  const vh = cv.height / scale;
  cam.x = clamp(my.x - VW/2, 0, W - VW);
  cam.y = H/2 - vh/2;
  ctx.setTransform(scale, 0, 0, scale, -cam.x * scale, -cam.y * scale);

  // 다리(외길): 어두운 나락 위에 얼음 다리
  ctx.fillStyle = "#1c4a5e"; ctx.fillRect(0, 50, W, H - 100);
  ctx.fillStyle = "#4aa3ff22"; ctx.fillRect(0, 50, 330, H - 100);
  ctx.fillStyle = "#ff5a6a22"; ctx.fillRect(W - 330, 50, 330, H - 100);
  ctx.fillStyle = "#ffffff12";
  for (let x = 0; x < W; x += 100) ctx.fillRect(x, 50, 2, H - 100);
  ctx.strokeStyle = "#cfe9f5"; ctx.lineWidth = 4;
  ctx.strokeRect(0, 50, W, H - 100);

  circle(90, H/2, 60, "#1b4f86", COL.b); bar(90, H/2 - 80, 120, snap.n[0], 1500, COL.b);
  circle(W - 90, H/2, 60, "#862a36", COL.r); bar(W - 90, H/2 - 80, 120, snap.n[1], 1500, COL.r);

  for (const T of snap.tw) {
    if (T[2] <= 0) continue;
    ctx.fillStyle = COL[T[0]]; ctx.fillRect(T[1] - 24, H/2 - 24, 48, 48);
    ctx.fillStyle = "#0008"; ctx.fillRect(T[1] - 14, H/2 - 14, 28, 28);
    bar(T[1], H/2 - 42, 56, T[2], 800, "#7fe08a");
    if (T[3]) { ctx.strokeStyle = "#ffe27a"; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(T[1], H/2); ctx.lineTo(T[3], T[4]); ctx.stroke(); }
  }
  for (const w of snap.wl) { ctx.globalAlpha = .5; circle(w[0], w[1], w[2], "#9fe3ff"); ctx.globalAlpha = 1; }
  const now = performance.now();
  fxs = fxs.filter((x) => now - x.t < 350);
  for (const x of fxs) { ctx.globalAlpha = 1 - (now - x.t) / 350; circle(x.x, x.y, x.r, COL[x.team] + "55", "#fff", 2); ctx.globalAlpha = 1; }
  for (const m of snap.m) { circle(m[1], m[2], 12, COL[m[0]] + "cc"); bar(m[1], m[2] - 22, 26, m[3], 120, "#7fe08a"); }
  for (const s of snap.s) circle(s[0], s[1], 8, "#fff", COL[s[2]]);

  for (const p of snap.p) {
    const [id, team, nm, , , hp, max, dead, , , , , chk, sh] = p, d = disp.get(id);
    ctx.globalAlpha = dead ? 0.25 : 1;
    circle(d.x, d.y, 20, COL[team], id === me.id ? "#fff" : null);
    if (sh > 0) circle(d.x, d.y, 25, null, "#fff8", 2);
    ctx.fillStyle = "#fff"; ctx.font = "bold 16px sans-serif"; ctx.textAlign = "center";
    ctx.fillText((NAMES[chk] || "?")[0], d.x, d.y + 6);
    ctx.globalAlpha = 1;
    if (!dead) {
      bar(d.x, d.y - 36, 50, hp, max, "#7fe08a");
      ctx.font = "bold 13px sans-serif"; ctx.fillText(`${nm} (${NAMES[chk]})`, d.x, d.y - 42);
    }
  }

  // ---- 화면 고정 UI ----
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  // 미니맵
  ctx.fillStyle = "#07111acc"; ctx.fillRect(mini.x, mini.y, mini.w, mini.h);
  ctx.strokeStyle = "#cfe9f5"; ctx.lineWidth = 2; ctx.strokeRect(mini.x, mini.y, mini.w, mini.h);
  const mx = (x) => mini.x + x / W * mini.w, my2 = (y) => mini.y + y / H * mini.h, u = mini.w / 300;
  for (const T of snap.tw) if (T[2] > 0) { ctx.fillStyle = COL[T[0]]; ctx.fillRect(mx(T[1]) - 3*u, my2(H/2) - 3*u, 6*u, 6*u); }
  circle(mx(90), my2(H/2), 5*u, COL.b); circle(mx(W - 90), my2(H/2), 5*u, COL.r);
  for (const m of snap.m) circle(mx(m[1]), my2(m[2]), 1.5*u, COL[m[0]]);
  for (const p of snap.p) if (!p[7]) { const d = disp.get(p[0]); circle(mx(d.x), my2(d.y), 3.5*u, COL[p[1]], p[0] === me.id ? "#fff" : null, 1.5*u); }
  ctx.strokeStyle = "#fff"; ctx.lineWidth = 1; ctx.strokeRect(mx(cam.x), my2(cam.y), VW / W * mini.w, Math.min(mini.h, vh / H * mini.h));
  // 점수판
  ctx.textAlign = "right"; ctx.font = `${13 * dpr}px sans-serif`;
  [...snap.p].sort((a, b) => b[8] - a[8]).slice(0, 10).forEach((p, i) => {
    ctx.fillStyle = COL[p[1]]; ctx.fillText(`${p[2]}  ${p[8]}/${p[9]}`, cv.width - 12 * dpr, (22 + i * 17) * dpr);
  });

  const mine = snap.p.find((p) => p[0] === me.id);
  if (mine) {
    bq.lastChild.style.height = Math.min(100, mine[10] / (me.cdq || 1) * 100) + "%";
    bw.lastChild.style.height = Math.min(100, mine[11] / (me.cdw || 1) * 100) + "%";
    if (mine[7]) msg.textContent = "부활 대기 중…"; else if (!snap.win) msg.textContent = "";
  }
  if (snap.win) msg.innerHTML = (snap.win === "b" ? "블루팀" : "레드팀") + " 승리!<br><small style='font-size:18px'>곧 새 게임이 시작됩니다</small>";
}
draw();
</script>
</body>
</html>
